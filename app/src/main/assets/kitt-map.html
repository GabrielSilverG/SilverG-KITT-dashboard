<!DOCTYPE html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;background:#060c15;font-family:monospace}#map .leaflet-tile-pane{filter:grayscale(1) invert(1) hue-rotate(160deg) brightness(.7) contrast(1.35)}.leaflet-container{background:#07121c}.leaflet-control-zoom a{background:#111e2d!important;color:#2ee1f5!important;border-color:#ff2842!important}#hud{position:absolute;z-index:1000;left:12px;top:12px;color:#2ee1f5;background:#08101de8;padding:9px;border:1px solid #ff2842;font-size:12px;pointer-events:none}#status{color:#ffb42d}#locate{position:absolute;z-index:1000;right:12px;bottom:16px;background:#3d1526;color:#fff;border:1px solid #ff2842;padding:13px;font: bold 14px monospace}#credit{position:absolute;z-index:1000;left:8px;bottom:5px;color:#b9c8d4;background:#07121ddd;font-size:10px}</style></head><body><div id="map"></div><div id="hud">SILVERG // KITT NAV<br><span id="status">GPS SIGNAL: WAITING</span></div><button id="locate" onclick="locate()">CENTER GPS</button><div id="credit">© OpenStreetMap contributors</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>var map,marker,hasFix=false;function boot(){if(!window.L){document.getElementById('status').textContent='MAP OFFLINE - CHECK INTERNET';return}map=L.map('map',{zoomControl:true}).setView([46.0569,14.5058],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}function setPosition(lat,lon,accuracy){if(!map)return;var pos=[lat,lon];if(!marker){marker=L.circleMarker(pos,{radius:9,color:'#ff2842',fillColor:'#2ee1f5',fillOpacity:1,weight:3}).addTo(map);map.setView(pos,16)}else marker.setLatLng(pos);hasFix=true;document.getElementById('status').textContent='GPS ACTIVE / ±'+Math.round(accuracy)+'m'}function locate(){if(map&&marker)map.setView(marker.getLatLng(),16);else document.getElementById('status').textContent='WAITING FOR GPS FIX'}boot();</script></body></html>
